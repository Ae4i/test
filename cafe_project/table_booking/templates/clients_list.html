{% extends 'base.html' %}

{% block title %}Активні користувачі{% endblock %}

{% block content %}
<h2>Активні користувачі</h2>

<ul>
  {% for client in clients %}
    <li>
      <a href="/table-booking/clients/{{ client.name }}/">
        Клієнт {{ client.name }} {{ client.telephone }} {{ client.email }}
      </a>
    </li>
  {% empty %}
    <li>Немає клієнтів</li>
  {% endfor %}
</ul>
{% endblock %}
